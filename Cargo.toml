[package]
name = "cavalry"
version = "0.1.0"
edition = "2024"
description = "The troop that rides in after the fact and writes down what a human responder actually did, because the agent log alone cannot be trusted."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
